<header class="site-header">
  <div class="wrap header-row">
    <a class="brand" href="{{ "/" | relURL }}">{{ partial "mark.html" . }}<span>Spindle</span></a>
    <nav aria-label="Main">
      <ul>
        {{- range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
    <a class="button button-quiet" href="{{ site.Params.signInURL }}">Sign in</a>
  </div>
</header>
