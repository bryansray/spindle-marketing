{{ define "main" }}
<section class="hero">
  <div class="wrap">
    <p class="eyebrow">{{ .Params.eyebrow }}</p>
    <h1>{{ .Title }}</h1>
    <p class="lede">{{ .Params.lede }}</p>
    {{ partial "cta.html" . }}
  </div>
</section>

<section class="wrap example" aria-label="Example">
  <figure class="compare">
    <div class="compare-col">
      <p class="label">Other tools</p>
      <p class="mono">Mage · 2 kicks</p>
    </div>
    <div class="compare-col compare-ours">
      <p class="label">Spindle</p>
      <p class="mono">Mage · 2 of 11 <span class="muted">kicks taken with the interrupt ready</span></p>
    </div>
    <figcaption class="muted">Counts tell you what happened. Spindle tells you what could have.</figcaption>
  </figure>
</section>

<section class="wrap features" aria-labelledby="features-title">
  <h2 id="features-title">Between every pull</h2>
  <ul class="feature-grid">
    {{- range .Params.features }}
    <li class="panel">
      <h3>{{ .title }}</h3>
      <p>{{ .text }}</p>
    </li>
    {{- end }}
  </ul>
</section>

<section class="wrap prose">
  {{ .Content }}
</section>
{{ end }}
