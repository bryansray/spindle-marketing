baseURL = "https://www.spindlelogs.com/"
locale = "en-US"
title = "Spindle"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "Mythic+ coaching from your combat log: not just what you did, but what you could have done."
  appURL = "https://app.spindlelogs.com"
  signInURL = "https://app.spindlelogs.com/login"
  installURL = "/download/"
  downloadsURL = "https://downloads.spindlelogs.com"

[menus]
  [[menus.main]]
    name = "Features"
    pageRef = "/features"
    weight = 10
  [[menus.main]]
    name = "How it works"
    pageRef = "/how-it-works"
    weight = 20
  [[menus.main]]
    name = "What Spindle reads"
    pageRef = "/privacy"
    weight = 30
  [[menus.main]]
    name = "FAQ"
    pageRef = "/faq"
    weight = 40
  [[menus.main]]
    name = "Download"
    pageRef = "/download"
    weight = 50

[markup.goldmark.renderer]
  unsafe = false

# The Download page reads latest.json on every build (Hugo would otherwise
# keep its first copy forever, and the page would never move on).
[caches.getresource]
  maxAge = 0

[minify]
  minifyOutput = true
