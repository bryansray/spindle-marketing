name: Deploy

# Builds the site and deploys it to Cloudflare (wrangler.jsonc), the same
# `just deploy` as from a laptop, then checks the live site (`just hosts`).
#
# On every push to main, and by hand (Actions > Deploy > Run workflow). A
# Spindle release needs no deploy: the Download page links the downloads
# bucket's latest/ files, which the release replaces.
#
# The `Production` environment (deployment branches: main only) holds the
# secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit on the account;
# Workers Routes: Edit and Zone: Read on spindlelogs.com) and the variable
# CLOUDFLARE_ACCOUNT_ID. The actions are pinned by commit, and Hugo's
# download is checked against its release's checksums.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.167.0
  WRANGLER_VERSION: 4.148.0

jobs:
  deploy:
    # Only the site's own repository (not forks), only main.
    if: github.repository == 'bryansray/spindle-marketing' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: just@1
      - name: Hugo (extended), checked against the release's checksums
        run: |
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          file="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$file"
          curl -fsSLO "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${file}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p hugo && tar -xzf "$file" -C hugo hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - name: Wrangler
        run: npm install -g --no-fund --no-audit "wrangler@$WRANGLER_VERSION"
      - name: Build, check, and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::The Production environment has no CLOUDFLARE_API_TOKEN secret"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::The Production environment has no CLOUDFLARE_ACCOUNT_ID variable"; exit 1; }
          hugo version
          just deploy
      - name: Check the live site
        run: |
          sleep 10
          just hosts
